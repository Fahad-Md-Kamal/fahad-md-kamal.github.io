    <script>
      // Apply the saved (or system) theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var light = saved === 'light' || (saved !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (light) document.documentElement.classList.add('light');
          document.documentElement.style.colorScheme = light ? 'light' : 'dark';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#dbe0eb' : '#0B0F14');
        } catch (e) {}
      })();
    </script>
